 </head>
 <body>
   <div class="contenedor">
    <h1>MASA CORPORAL</h1>
    <form action="" method="get">
        <input type="number" name="identificacion" id="identificacion" placeholder="Ingrese la identificación del paciente"><br><br>

    </form>
  </div>
